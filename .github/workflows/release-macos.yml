name: Release macOS

# Construye el .dmg y el .app y los adjunta al mismo borrador de GitHub Release
# que crean los demás workflows, en cada tag vX.Y.Z. Firma y notariza SOLO si
# los secretos `APPLE_*` existen en el repositorio (RF-36, v0.6.0, Slice 52) —
# hoy no existen (el usuario todavía no tiene la cuenta de Apple Developer), así
# que el build sale sin firmar, igual que hasta ahora. Ver NATIVE_APPS_RELEASE_CI.md
# §8 sobre por qué distribuir sin firma es una decisión legítima mientras tanto,
# y su checklist de Gatekeeper para el usuario final (clic derecho → Abrir, o
# `xattr -cr` sobre el .app).
#
# Build universal (--target universal-apple-darwin): macos-latest es Apple
# Silicon, así que sin esto el binario no arrancaría en un Mac Intel — Rosetta
# traduce x86_64→Apple Silicon, no al revés (NATIVE_APPS_RELEASE_CI.md §5).
#
# DOS PASOS PROPIOS DE ESTE PROYECTO, que no están en la plantilla de la casa
# porque el starter no lleva sidecar:
#
#   1. El compilador Typst se vendoriza ANTES de `tauri build`; no se versiona
#      en el repositorio y sin él el .app saldría sin compilador dentro.
#   2. Un build universal exige un sidecar universal, y Typst publica un binario
#      POR ARQUITECTURA. Hay que vendorizar los dos y fundirlos con `lipo` en
#      `typst-universal-apple-darwin`, que es el nombre que Tauri buscará. Sin
#      este paso el build falla al no encontrar el sidecar de ese triple.
#
# SIN auto-actualización, igual que Linux (NATIVE_APPS_RELEASE_CI.md §7): la
# clave de firma vive solo en la máquina del mantenedor. De ahí
# `createUpdaterArtifacts: false` en tauri.macos.conf.json e
# `includeUpdaterJson: false` aquí.
#
# AVISO IMPORTANTE sobre el menú nativo de macOS (src-tauri/src/macos_menu.rs):
# este workflow es la PRIMERA vez que ese módulo pasa por un compilador. Se
# escribió sin toolchain de macOS disponible, verificando la API contra el
# código fuente vendorizado de tauri/muda. Si algo va a fallar aquí, es eso.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: >
          "true" (normal): crea o reutiliza un borrador para esa versión. "false": la Release
          de esa versión ya está PUBLICADA y solo quieres añadirle los artefactos de macOS.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-macos:
    runs-on: macos-latest
    # Igual que en Linux: el GITHUB_TOKEN por defecto es de solo lectura y sin
    # esto tauri-action falla con "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determinar si la Release debe tratarse como borrador
        id: draft
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Rust (targets Intel + Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias de Node
        run: npm ci

      # Desde v0.5.0 `bundle.externalBin` declara DOS sidecars (typst y tinymist).
      # Los dos necesitan el mismo tratamiento: descargar las dos arquitecturas y
      # fundirlas, porque `--target universal-apple-darwin` exige que el fichero
      # exista con el sufijo `-universal-apple-darwin`.
      - name: Vendorizar los sidecars (las dos arquitecturas)
        run: |
          npm run vendor:typst -- --target aarch64-apple-darwin
          npm run vendor:typst -- --target x86_64-apple-darwin
          npm run vendor:tinymist -- --target aarch64-apple-darwin
          npm run vendor:tinymist -- --target x86_64-apple-darwin

      - name: Fundir cada sidecar en un binario universal
        run: |
          for sidecar in typst tinymist; do
            lipo -create \
              -output "src-tauri/binaries/${sidecar}-universal-apple-darwin" \
              "src-tauri/binaries/${sidecar}-aarch64-apple-darwin" \
              "src-tauri/binaries/${sidecar}-x86_64-apple-darwin"
            chmod +x "src-tauri/binaries/${sidecar}-universal-apple-darwin"
          done

      - name: Verificar que los sidecars universales son correctos
        run: |
          for sidecar in typst tinymist; do
            binary="src-tauri/binaries/${sidecar}-universal-apple-darwin"
            if ! lipo -info "$binary" | grep -q "x86_64 arm64"; then
              echo "::error::El sidecar $sidecar no contiene las dos arquitecturas; un Mac Intel no podría usarlo."
              lipo -info "$binary"
              exit 1
            fi
            "$binary" --version
          done

      - name: Verificar el catálogo de plantillas contra el compilador real
        run: npm run verify:templates

      - name: Tests del backend
        run: npm test

      # RF-36 (v0.6.0, Slice 52): firma/notarización condicionada a que estos
      # secretos EXISTAN en el repositorio — hoy no existen (el usuario aún no
      # tiene la cuenta de Apple Developer, ARCHITECTURE.md §7.16.6).
      #
      # CORREGIDO (2026-09-13, hallazgo del primer run real de v0.6.0): la
      # primera versión de este paso ponía las seis variables `APPLE_*` en el
      # mismo bloque `env:` de un único step, con `${{ secrets.APPLE_CERTIFICATE }}`
      # etc. — con los secretos vacíos, eso NO omite la variable de entorno,
      # la deja EXISTIR con valor "". El bundler de Tauri decide si firmar
      # comprobando si `APPLE_CERTIFICATE` existe en el entorno, no si tiene
      # contenido, así que intentaba importar un certificado vacío y fallaba:
      # "SecKeychainItemImport: ... not valid" / "failed to import keychain
      # certificate". v0.5.0 no tenía este bloque todavía, por eso nunca lo
      # sufrió. Ahora son DOS steps mutuamente excluyentes (`if:` sobre si el
      # secreto llega no vacío) para que las variables `APPLE_*` NO EXISTAN en
      # absoluto en el entorno del step sin firmar — evita el riesgo R-36 del
      # plan (CI en rojo permanente) sin necesitar que el secreto exista.
      - name: Comprobar si hay secretos de firma de Apple configurados
        id: apple_signing
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build y Release (macOS universal, sin firmar)
        if: steps.apple_signing.outputs.enabled == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: false

      - name: Build y Release (macOS universal, firmado)
        if: steps.apple_signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: false
