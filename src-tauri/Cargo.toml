[package]
name = "dbv-typst-editor"
version = "0.1.0"
description = "Editor de escritorio multiplataforma para documentos Typst, con vista previa PDF en tiempo real"
authors = ["David Bueno Vallejo <https://github.com/davidbuenov>"]
license = "MIT"
edition = "2021"

[lib]
name = "dbv_typst_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Necesario desde el Slice 2: gestión del sidecar `typst` (ARCHITECTURE.md §7.2).
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Slice 3: observador de cambios en disco sobre la raíz del proyecto (watcher.rs).
notify = "8"
# Slice 3: manifiesto propio de proyecto `settings/dbv-project.toml` (project.rs).
toml = "0.8"
# Slice 5: un directorio temporal por compilación de vista previa, borrado en Drop
# (requisito (c) del Adversarial Architect Review del plan).
tempfile = "3"
# v0.2: Project Archive `.dbvt` (archive.rs) — decisión cerrada en
# ARCHITECTURE.md §7.12. Licencia MIT/Apache-2.0, ampliamente usada.
zip = "2"
# Beta: instancia única — mismo patrón que DBV Markdown Reader
# (ARCHITECTURE.md §2, "solo desktop"). Gated con #[cfg(desktop)] en lib.rs.
tauri-plugin-single-instance = "2"

# Beta: menú nativo de macOS (macos_menu.rs) — dependencia exclusiva de esa
# plataforma (`[target...]`, no una feature): en Windows/Linux ni siquiera se
# resuelve, coherente con que el propio módulo está `#[cfg(target_os = "macos")]`.
[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
