  Reproduce el esqueleto real del shell (cabecera + cuerpo + lanzador +
  espacio de trabajo) con las hojas de estilo REALES, y comprueba en un motor
  de verdad lo único que ni los tests de Vitest ni `verify:frontend` pueden
  comprobar: que las cajas ocupan el ancho que deben. Sin datos, sin Tauri y
  sin `main.js` — sólo geometría.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../src/themes/tokens.css" />
    <link rel="stylesheet" href="../src/themes/base.css" />
    <link rel="stylesheet" href="../src/themes/layout.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__title">DBV Typst Editor</span>
        <span class="app-header__project" id="project-name">D:\proyectos\un-nombre-de-proyecto-largo</span>
        <span class="app-header__badge" id="project-kind">proyecto externo</span>
        <div id="git-indicator" class="git-indicator">
          <button id="git-btn" class="git-btn" type="button">
            <span class="git-icon">&#8631;</span>
            <span class="git-branch">master</span>
            <span class="git-status-summary">12 modificados</span>
          </button>
        </div>
      </div>
      <div class="app-header__actions">
        <div class="app-header__group" id="project-actions">
          <div class="mode-switcher" role="group">
            <button class="mode-switcher__button" type="button">P</button>
            <button class="mode-switcher__button" type="button">E</button>
            <button class="mode-switcher__button" type="button">V</button>
          </div>
        </div>
        <div class="header-menu">
          <button id="btn-file-menu" class="button button--ghost button--icon-label" type="button">
            <span>Archivo</span><span class="header-menu__caret">&#9662;</span>
          </button>
        </div>
        <div class="header-menu">
          <button id="btn-tools-menu" class="button button--ghost button--icon-label" type="button">
            <span>Herramientas</span><span class="header-menu__caret">&#9662;</span>
          </button>
        </div>
        <div class="segmented-control">
          <button class="segmented-control__btn active" type="button">ES</button>
          <button class="segmented-control__btn" type="button">EN</button>
        </div>
        <div class="segmented-control">
          <button class="segmented-control__btn" type="button">A</button>
          <button class="segmented-control__btn active" type="button">B</button>
          <button class="segmented-control__btn" type="button">C</button>
        </div>
        <button class="icon-button" type="button">U</button>
        <button class="icon-button" type="button">?</button>
        <button class="icon-button" type="button">i</button>
      </div>
    </header>
    <main class="app-body">
      <section class="launcher" id="empty-view">
        <div class="launcher__inner">
          <h1 class="launcher__heading">Titulo</h1>
          <div class="launcher__start">
            <button class="launcher__primary">
              <span class="launcher__primary-corner launcher__primary-corner--tl"></span>
              <span class="launcher__primary-corner launcher__primary-corner--tr"></span>
              <span class="launcher__primary-corner launcher__primary-corner--bl"></span>
              <span class="launcher__primary-corner launcher__primary-corner--br"></span>
              <span class="launcher__primary-icon"></span>
              <span class="launcher__primary-text">
                <span class="launcher__primary-label">Nuevo documento</span>
                <span class="launcher__primary-hint">Plantillas locales y del Typst Universe</span>
              </span>
            </button>
            <div class="launcher__actions">
              <button class="launcher__action-card"><span class="launcher__action-icon"></span><span class="launcher__action-text"><span class="launcher__action-label">Abrir carpeta</span><span class="launcher__action-hint">Proyecto Typst o repositorio clonado</span></span></button>
              <button class="launcher__action-card"><span class="launcher__action-icon"></span><span class="launcher__action-text"><span class="launcher__action-label">Abrir .typ</span><span class="launcher__action-hint">Un documento suelto</span></span></button>
              <button class="launcher__action-card"><span class="launcher__action-icon"></span><span class="launcher__action-text"><span class="launcher__action-label">Importar .dbvt</span><span class="launcher__action-hint">Proyecto empaquetado</span></span></button>
              <button class="launcher__action-card"><span class="launcher__action-icon"></span><span class="launcher__action-text"><span class="launcher__action-label">Clonar repositorio</span><span class="launcher__action-hint">Desde una URL de Git</span></span></button>
            </div>
          </div>
        </div>
      </section>
      <section class="workspace hidden" id="workspace-view">
        <aside class="sidebar" id="sidebar">sidebar</aside>
        <div class="splitter" id="splitter-sidebar"></div>
        <div class="document">documento</div>
        <div class="splitter" id="splitter-preview"></div>
        <aside class="preview">
          <div class="preview__bar">barra</div>
          <div class="preview__pages" id="preview-pages"></div>
          <div class="splitter splitter--row hidden" id="splitter-band"></div>
          <pre class="preview__band hidden" id="preview-band"></pre>
        </aside>
      </section>
    </main>
    <pre id="probe"></pre>
    <script>
      const checks = [];
      const add = (name, ok, detail) => checks.push({ name, ok, detail });
      const w = (sel) => Math.round(document.querySelector(sel).getBoundingClientRect().width);

      const viewport = document.documentElement.clientWidth;

      // 1. El cuerpo y el lanzador ocupan TODA la ventana. Se comprueba porque
      //    ya falló una vez: un `place-items: center` huérfano en `.app-body`
      //    (heredado del andamiaje del Slice 1) dejó de ser inerte cuando
      //    Chromium implementó `justify-items` para cajas de bloque, y encogía
      //    al contenido todo hijo del cuerpo.
      add('.app-body ocupa todo el ancho de la ventana', w('.app-body') === viewport, `${w('.app-body')}/${viewport}`);

      // 1a. La cabecera aguanta en UNA fila con un proyecto abierto y la ventana
      //     estrecha. Se mide a 830 px porque es el ancho al que un usuario la
      //     vio partida en tres líneas, con el nombre del producto troceado
      //     ("DBV / Typst / Editor") y los distintivos montándose unos sobre
      //     otros: `.app-header__actions` no encoge, así que toda la presión cae
      //     sobre la marca, y el título no llevaba `nowrap`.
      const header = document.querySelector('.app-header');
      const titulo = document.querySelector('.app-header__title');
      const anchoOriginal = document.body.style.width;
      document.body.style.width = '830px';

      const alturaCabecera = header.getBoundingClientRect().height;
      const alturaTitulo = titulo.getBoundingClientRect().height;
      add(
        'la cabecera se mantiene en una sola fila con la ventana estrecha',
        alturaCabecera < 56,
        `${Math.round(alturaCabecera)}px de alto a 830px de ancho`
      );
      add(
        'el nombre del producto no se parte en varias líneas',
        alturaTitulo < 26,
        `${Math.round(alturaTitulo)}px de alto`
      );

      // Y nada de la marca se monta encima de lo siguiente: al recortarse, cada
      // elemento debe empezar donde acaba el anterior, no solaparlo.
      // La barra de acciones no encoge (`flex: 0 0 auto`), así que su ancho es el
      // que decide cuánto le queda a la marca. Antes de RF-30 se llevaba 356 px
      // solo en cinco botones de texto —medido en este mismo motor— y por eso la
      // cabecera reventaba en cuanto el proyecto tenía nombre largo.
      const anchoAcciones = document.querySelector('.app-header__actions').getBoundingClientRect().width;
      add(
        'la barra de acciones deja sitio a la marca',
        anchoAcciones <= 640,
        `${Math.round(anchoAcciones)}px de acciones`
      );

      const marca = [...document.querySelector('.app-header__brand').children];
      const solapados = marca.filter((el, i) => {
        if (i === 0) return false;
        return el.getBoundingClientRect().left < marca[i - 1].getBoundingClientRect().right - 1;
      });
      add(
        'los elementos de la marca no se solapan entre sí',
        solapados.length === 0,
        `${marca.length} elementos, ${solapados.length} solapados`
      );

      document.body.style.width = anchoOriginal;
      add('el lanzador ocupa todo el ancho de la ventana', w('#empty-view') === viewport, `${w('#empty-view')}/${viewport}`);

      // 1b. El bloque de arranque (RF-25) no desborda a su contenedor: dos
      //     columnas, y en la derecha tres botones con icono que crecieron al
      //     añadirles el pictograma. jsdom no calcula cajas, así que este es el
      //     único sitio del proyecto donde ese desbordamiento se puede ver.
      const inner = document.querySelector('.launcher__inner');
      const start = document.querySelector('.launcher__start');
      add(
        'el bloque de arranque cabe en el lanzador',
        start.getBoundingClientRect().width <= inner.getBoundingClientRect().width + 1,
        `${Math.round(start.getBoundingClientRect().width)}/${Math.round(inner.getBoundingClientRect().width)}`
      );

      // Rejilla 2x2 (rediseño posterior a RF-44): dos filas de dos, no una
      // fila de cuatro — se comprueba que de verdad forman 2 filas (no 4, que
      // sería la rejilla colapsando a una columna por falta de espacio) y que
      // ninguna tarjeta se desborda del contenedor.
      const acciones = document.querySelector('.launcher__actions');
      const tarjetas = [...acciones.children];
      const filas = new Set(tarjetas.map((b) => Math.round(b.getBoundingClientRect().top))).size;
      add(
        'las cuatro tarjetas de acciones forman una rejilla 2x2',
        filas === 2,
        `${tarjetas.length} tarjetas en ${filas} fila(s)`
      );
      add(
        'las tarjetas de acciones no desbordan su rejilla',
        tarjetas.every((b) => b.getBoundingClientRect().right <= acciones.getBoundingClientRect().right + 1),
        `${tarjetas.length} tarjetas`
      );

      // 2. Cada combinación de paneles reparte el ancho completo, sin huecos
      //    muertos ni desbordamiento (§7.9, `app/workspacePanels.js`).
      document.getElementById('empty-view').classList.add('hidden');
      const ws = document.getElementById('workspace-view');
      ws.classList.remove('hidden');
      const PARTS = ['.sidebar', '#splitter-sidebar', '.document', '#splitter-preview', '.preview'];

      for (const sidebar of [true, false]) {
        for (const editor of [true, false]) {
          for (const preview of [true, false]) {
            if (!sidebar && !editor && !preview) continue; // siempre queda uno visible
            ws.dataset.panelSidebar = sidebar ? 'show' : 'hide';
            ws.dataset.panelEditor = editor ? 'show' : 'hide';
            ws.dataset.panelPreview = preview ? 'show' : 'hide';

            const label = `${sidebar ? 'P' : '-'}${editor ? 'E' : '-'}${preview ? 'V' : '-'}`;
            const total = PARTS.map(w).reduce((a, b) => a + b, 0);
            const width = w('#workspace-view');
            const overflows = ws.scrollWidth > ws.clientWidth;
            add(
              `paneles ${label}: reparten el ancho exacto, sin desbordar`,
              total === width && width === viewport && !overflows,
              `suma=${total} panel=${width} ventana=${viewport}${overflows ? ' DESBORDA' : ''}`
            );
          }
        }
      }

      document.getElementById('probe').textContent = `DBV_LAYOUT_JSON${JSON.stringify(checks)}DBV_LAYOUT_END`;
    </script>
  </body>
</html>
