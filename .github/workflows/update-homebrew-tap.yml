name: Update Homebrew Tap

# Actualiza automáticamente el Cask de davidbuenov/homebrew-dbv-typst-editor
# (versión + sha256 de macOS + sha256 de Linux) cada vez que una Release de este
# repo pasa a estado "Publicada". Mismo patrón que dbv-md-reader, con una
# diferencia: aquel Cask solo sirve macOS y este sirve también Linux (Homebrew
# 6.0.0 admite AppImage en casks), así que hay DOS ficheros que verificar.
#
# Se dispara con el evento nativo `release: published`, NO al terminar
# release-macos.yml ni release-linux.yml: ambos dejan la Release en borrador
# hasta que el maintainer sube a mano el ejecutable de Windows, y los assets de
# un borrador no tienen URL pública — calcular el sha256 entonces apuntaría el
# Cask a un fichero que nadie puede descargar todavía.
#
# Si la Release no trae AMBOS ficheros (el .dmg universal y el .AppImage), el
# job no falla ni actualiza nada: subir la versión con un solo sha256 nuevo
# dejaría roto el Cask en la otra plataforma.

on:
  release:
    types: [published]
  # Para probar la conexión con el tap sin publicar una Release nueva: se lanza
  # a mano indicando el tag (p. ej. v0.7.0). Con el Cask ya en esa versión no
  # cambia nada y termina con "ya estaba al día".
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la Release existente cuyo .dmg y .AppImage se calculan (vX.Y.Z)"
        required: true

# Mínimo privilegio: el GITHUB_TOKEN de este workflow solo lee (descarga los
# ficheros de la Release). La escritura en el tap va con HOMEBREW_TAP_TOKEN, un
# token aparte limitado a ESE repositorio.
permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el .dmg de macOS y el .AppImage de Linux de la Release
        id: dl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El nombre del tag lo elige quien crea la Release — nunca se
          # interpola directamente en un `run:` (patrón de "script injection"
          # que las guías de seguridad de GitHub Actions desaconsejan
          # explícitamente); se pasa siempre por variable de entorno.
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release download "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --pattern "*universal.dmg" \
              --output macos.dmg \
            || ! gh release download "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --pattern "*amd64.AppImage" \
              --output linux.AppImage; then
            echo "::warning::La Release no trae el .dmg universal Y el .AppImage — se omite la actualización del tap de Homebrew."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Calcular versión y sha256
        if: steps.dl.outputs.found == 'true'
        id: meta
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          # Guard clause: VERSION acaba escrito tal cual dentro de un fichero
          # Ruby (Casks/dbv-typst-editor.rb) que Homebrew ejecuta en la máquina
          # de cualquier usuario que instale/actualice el Cask — sin esta
          # validación, un tag con formato inesperado podría inyectar código
          # Ruby en el tap en vez de solo un número de versión.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG_NAME' no tiene formato semver (vX.Y.Z) — se aborta para no escribir un valor sin validar en el Cask." >&2
            exit 1
          fi
          SHA_MACOS=$(sha256sum macos.dmg | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum linux.AppImage | cut -d' ' -f1)
          for sha in "$SHA_MACOS" "$SHA_LINUX"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::sha256sum devolvió un valor con formato inesperado." >&2
              exit 1
            fi
          done
          {
            echo "version=$VERSION"
            echo "sha_macos=$SHA_MACOS"
            echo "sha_linux=$SHA_LINUX"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout del repositorio del tap
        if: steps.dl.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          repository: davidbuenov/homebrew-dbv-typst-editor
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Actualizar el Cask (versión + un sha256 por plataforma)
        if: steps.dl.outputs.found == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA_MACOS: ${{ steps.meta.outputs.sha_macos }}
          SHA_LINUX: ${{ steps.meta.outputs.sha_linux }}
        run: |
          set -euo pipefail
          cd tap
          CASK=Casks/dbv-typst-editor.rb
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/" "$CASK"
          # Cada sha256 vive dentro de su bloque `on_macos` / `on_linux`; el
          # rango sed acota el cambio a ese bloque (ninguno contiene un `end`
          # anidado, así que el primer `  end` cierra el bloque).
          sed -i "/^  on_macos do/,/^  end/ s/^    sha256 \".*\"/    sha256 \"$SHA_MACOS\"/" "$CASK"
          sed -i "/^  on_linux do/,/^  end/ s/^    sha256 \".*\"/    sha256 \"$SHA_LINUX\"/" "$CASK"
          # Comprobación de que ambos cambios cayeron donde debían.
          grep -q "sha256 \"$SHA_MACOS\"" "$CASK"
          grep -q "sha256 \"$SHA_LINUX\"" "$CASK"

      - name: Commit y push si hay cambios
        if: steps.dl.outputs.found == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet; then
            echo "El Cask ya estaba al día (sin cambios) — nada que publicar."
            exit 0
          fi
          git config user.name "dbv-typst-editor-bot"
          git config user.email "actions@github.com"
          git add Casks/dbv-typst-editor.rb
          git commit -m "chore: bump dbv-typst-editor to $VERSION"
          git push
