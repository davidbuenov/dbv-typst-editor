name: Release Linux

# Construye el .deb y el .AppImage y los adjunta a un borrador de GitHub Release
# en cada tag vX.Y.Z. El flujo de Windows sigue siendo manual, en la máquina del
# mantenedor (ver README.md): este workflow crea o actualiza el mismo borrador
# para que solo haya que subir encima el instalador de Windows y publicar.
#
# La versión se lee de src-tauri/tauri.conf.json y no de github.ref_name, para
# poder relanzarlo a mano (workflow_dispatch) sobre una versión cuyo tag ya
# existe, sin depender de empujar un tag nuevo.
#
# PASO PROPIO DE ESTE PROYECTO, que no existía en DBV Markdown Reader: el
# compilador Typst se vendoriza ANTES de `tauri build`. El binario no se
# versiona en el repositorio, así que sin este paso el instalador saldría sin
# compilador dentro — y por eso el paso verifica su presencia y falla de forma
# explícita en vez de dejar pasar un artefacto inservible.
#
# SIN auto-actualización en Linux, a propósito (NATIVE_APPS_RELEASE_CI.md §7):
# la clave de firma del actualizador vive SOLO en la máquina del mantenedor, que
# es donde se compila y firma Windows. Mezclar en un mismo `latest.json` una
# firma generada en CI con otra generada en local es la coordinación
# cross-máquina que ese documento descarta explícitamente. Por eso aquí no se
# pasan variables TAURI_SIGNING_*, `createUpdaterArtifacts: false` en
# tauri.linux.conf.json evita que `tauri build` falle al no encontrar la clave,
# e `includeUpdaterJson: false` evita publicar un manifiesto a medias.
#
# Deuda técnica consciente y registrada: Linux y macOS se instalan y actualizan
# a mano hasta que se resuelva la firma cross-máquina.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: >
          "true" (normal): crea o reutiliza un borrador para esa versión, a completar a
          mano con el instalador de Windows antes de publicar. "false": la Release ya
          está PUBLICADA y solo quieres añadirle los artefactos de Linux.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # El GITHUB_TOKEN por defecto del repositorio es de solo lectura, y sin este
    # permiso tauri-action falla al subir los artefactos con "Resource not
    # accessible by integration". Se concede solo a este workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determinar si la Release debe tratarse como borrador
        id: draft
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias del sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Vendorizar el compilador Typst (sidecar)
        run: npm run vendor:typst

      # `bundle.externalBin` declara DOS sidecars desde v0.5.0. Tauri aborta el
      # empaquetado si falta cualquiera de los dos para el target que se compila.
      - name: Vendorizar el servidor de lenguaje Tinymist (sidecar)
        run: npm run vendor:tinymist

      - name: Verificar que los dos sidecars están en su sitio
        run: |
          for sidecar in typst tinymist; do
            binary="src-tauri/binaries/${sidecar}-x86_64-unknown-linux-gnu"
            if ! ls "$binary" >/dev/null 2>&1; then
              echo "::error::Falta el sidecar $sidecar; el instalador saldría incompleto."
              exit 1
            fi
            "$binary" --version
          done

      - name: Verificar el catálogo de plantillas contra el compilador real
        run: npm run verify:templates

      - name: Tests del backend
        run: npm test

      - name: Build y Release (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: false

      # linuxdeploy (dentro de `tauri build`) deja `AppRun.wrapped` con permisos
      # 0770 y todo el squashfs pertenece a root. En un escritorio no se nota
      # porque el runtime FUSE monta los ficheros con el uid del usuario, pero
      # quien lo ejecuta como "otros" (el test con firejail del catálogo de
      # AppImageHub, PR AppImage/appimage.github.io#5808) recibe "Permission
      # denied" y la app no arranca. Se extrae, se normalizan los permisos, se
      # reempaqueta con el mismo nombre y se sustituye el asset que tauri-action
      # ya había subido. El .deb no se toca.
      - name: Normalizar permisos del AppImage y resubirlo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -euo pipefail
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          work=$(mktemp -d)
          cp "$appimage" "$work/original.AppImage"
          chmod +x "$work/original.AppImage"
          (cd "$work" && ./original.AppImage --appimage-extract >/dev/null)
          chmod -R u+rwX,go+rX,go-w "$work/squashfs-root"

          wget -q -O "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          "$work/appimagetool" -n "$work/squashfs-root" "$appimage"

          # Verificación sobre el AppImage ya reempaquetado, no sobre el directorio.
          check=$(mktemp -d)
          (cd "$check" && "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          ls -l "$check/squashfs-root/AppRun" "$check/squashfs-root/AppRun.wrapped" "$check/squashfs-root/usr/bin/"
          bad=$(find "$check/squashfs-root" -type f \( ! -perm -o+r -o -perm -o+w \))
          if [ -n "$bad" ] || [ ! -x "$check/squashfs-root/AppRun.wrapped" ] \
             || find "$check/squashfs-root/AppRun.wrapped" ! -perm -o+x | grep -q .; then
            echo "::error::El AppImage reempaquetado sigue con permisos incorrectos:"
            echo "$bad"
            exit 1
          fi

          # GitHub cambia los espacios del nombre por puntos al subir el asset
          # ("DBV.Typst.Editor_…"); --clobber solo reemplaza si el nombre local
          # ya coincide con ese.
          upload="$work/$(basename "$appimage" | tr ' ' '.')"
          cp "$appimage" "$upload"
          gh release upload "${{ steps.version.outputs.tag }}" "$upload" --clobber
