<helmet>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --shadow: rgba(0, 0, 0, 0.4);
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1280px;
      height: 860px;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
    }
    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }

    .modal {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.45);
    }
    .modal__card {
      width: 1080px;
      height: 780px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 48px var(--shadow);
    }

    .gallery__header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .gallery__title { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
    .gallery__subtitle { margin: 0; font-size: 13px; color: var(--text-secondary); }
    .gallery__close {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      cursor: pointer;
    }

    /* ── Las tres vías, en un solo sitio ───────────────────────────── */
    .gallery__tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .gallery__tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      margin-bottom: -1px;
      border: 1px solid transparent;
      border-bottom-color: transparent;
      border-radius: var(--radius) var(--radius) 0 0;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .gallery__tab.is-active {
      background: var(--bg-primary);
      border-color: var(--border);
      border-bottom-color: var(--bg-primary);
      color: var(--text-primary);
      font-weight: 600;
    }
    .gallery__tab-count {
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .gallery__search { position: relative; display: flex; align-items: center; }
    .gallery__search-icon { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--text-muted); }
    .gallery__search-input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
    }

    .gallery__body { display: grid; grid-template-columns: 340px 1fr; gap: 18px; flex: 1; min-height: 0; }
    .gallery__sidebar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .gallery__item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }
    .gallery__item.is-selected { background: var(--bg-tertiary); border-color: var(--accent); }
    .gallery__item-thumb {
      width: 34px;
      height: 46px;
      flex: none;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }
    .gallery__item-body { min-width: 0; flex: 1; }
    .gallery__item-title {
      display: block; font-size: 14px; font-weight: 600; }
    .gallery__item-desc {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gallery__item-version { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }

    /* ── Vista previa maquetada: el rasgo distintivo de la pantalla ── */
    .gallery__preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 0;
    }
    .gallery__paper {
      width: 340px;
      height: 481px;
      flex: none;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .gallery__meta { width: 100%; }
    .gallery__meta-title {
      display: block; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .gallery__meta-desc {
      display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    .gallery__chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-tertiary);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .modal__actions { display: flex; justify-content: flex-end; gap: 8px; }
    .button {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .button--ghost { background: transparent; }
    .button--primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
  </style>
</helmet>
