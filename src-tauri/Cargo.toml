[package]
name = "dbv-typst-editor"
version = "0.13.1"
description = "Editor de escritorio multiplataforma para documentos Typst, con vista previa PDF en tiempo real"
authors = ["David Bueno Vallejo <https://github.com/davidbuenov>"]
license = "MIT"
edition = "2021"

[lib]
name = "dbv_typst_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Necesario desde el Slice 2: gestión del sidecar `typst` (ARCHITECTURE.md §7.2).
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
# Slice 3: observador de cambios en disco sobre la raíz del proyecto (watcher.rs).
notify = "8"
# Slice 3: manifiesto propio de proyecto `settings/dbv-project.toml` (project.rs).
toml = "0.8"
# RF-83: cambiar solo `entrypoint` del manifiesto conservando comentarios y
# formato. Es la versión que ya trae `toml` 0.8 (sin código nuevo que descargar).
toml_edit = "0.20"
# RF-78: búsqueda en el proyecto. Ya estaban en `Cargo.lock` (dependencias de
# otras crates): pasan a directas sin código nuevo que descargar.
regex = "1"
walkdir = "2.5"
# Slice 5: un directorio temporal por compilación de vista previa, borrado en Drop
# (requisito (c) del Adversarial Architect Review del plan).
tempfile = "3"
# v0.2: Project Archive `.dbvt` (archive.rs) — decisión cerrada en
# ARCHITECTURE.md §7.12. Licencia MIT/Apache-2.0, ampliamente usada.
zip = "2"
# Beta: instancia única — mismo patrón que DBV Markdown Reader
# (ARCHITECTURE.md §2, "solo desktop"). Gated con #[cfg(desktop)] en lib.rs.
tauri-plugin-single-instance = "2"
# Beta: auto-actualización (ADR-ACTUALIZADOR-001). Ambos son de escritorio:
# `updater` no existe en móvil y `process` sirve para reiniciar tras instalar.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `fs::canonicalize` devuelve en Windows rutas con el prefijo de longitud
# extendida `\\?\`, que el sidecar `typst` no resuelve bien como `--root` ni
# `--package-path` ("os error 2" al abrir un `.typ` suelto, compilar desde la
# terminal avanzada o crear un proyecto desde plantilla). `dunce` da la misma
# ruta canónica sin ese prefijo.
dunce = "1"
# v0.6.0: pegar una imagen del portapapeles (RF-39). Los bytes cruzan el IPC en
# base64 porque un `Vec<u8>` viaja como JSON (`[137,80,78,71,…]`) y un recorte
# de pantalla ronda el megabyte. Ya venía vendorizado como dependencia
# transitiva, así que declararlo no añade descarga.
base64 = "0.22"

# v0.6.0: Universe Browser completo (RF-34) — descarga el índice público de
# Typst Universe (`packages.typst.org/preview/index.json`, ~4.700 paquetes).
# Misma librería que ya usaba DBV Markdown Reader para su propio catálogo
# (ARCHITECTURE.md §2), en vez de introducir un segundo cliente HTTP.
ureq = { version = "3", features = ["json"] }
# v0.6.0: Bibliografía visual completa (RF-35) — el mismo motor de parseo
# BibTeX/Hayagriva que usa el propio compilador Typst para `#bibliography()`,
# en vez de un crate distinto que pudiera divergir de lo que la app compila
# de verdad (ADR-BIBLIOGRAFIA-001, memory.md).
hayagriva = "0.10.1"
# v0.13.0: documentación de Typst offline (RF-96), empaquetada comprimida. Ya
# estaba en `Cargo.lock` (dependencia de `zip`): pasa a directa sin descarga.
flate2 = "1"
# v0.14.0 (RF-108.3): leer el README y la plantilla de un paquete de Universe sin instalarlo.
# Ya estaba en `Cargo.lock` (la usa `typst-kit`): pasa a directa sin descarga.
tar = "0.4"

# v0.9.0 (ADR-MOTOR-001): motor de vista previa EN PROCESO. Typst como librería, con
# versiones EXACTAS iguales a las del sidecar vendorizado (`scripts/vendor-typst.mjs`):
# es la condición para que la imagen coincida con la exportación del CLI. Una
# prueba (`engine::tests`) falla si dejan de coincidir. Licencia Apache-2.0: se
# conservan los avisos.
typst = "=0.15.1"
typst-ide = "=0.15.1"
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts", "system-files"] }
trash = "5"
keyring = "4"
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros", "schemars"] }

# Beta: menú nativo de macOS (macos_menu.rs) — dependencia exclusiva de esa
# plataforma (`[target...]`, no una feature): en Windows/Linux ni siquiera se
# resuelve, coherente con que el propio módulo está `#[cfg(target_os = "macos")]`.
[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"

# `npm run dev` compila en depuración, y Typst sin optimizar es unas 6 veces más
# lento: con el libro real de 206 páginas, 35 s por compilación (5,4 s en
# release), lo que agotaba el plazo del motor rápido. Las dependencias van
# optimizadas y el código propio con `opt-level = 1`, porque mucho código de
# Typst es genérico y se instancia dentro de este crate con SU nivel: solo con
# las dependencias se quedaba en 17 s; con los dos, 6 s. Sigue siendo
# depurable, y no afecta a lo que se publica (perfil release).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
